<html>
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="styles/calculator.css"></link>
    </head>
    <body>
      <br>
      <p class="js-print">
      </p>
        <p>
        <button
        class="number"
        id="one"
        onclick="input+='1';
        print();
        
        ">
        1</button>

         <button
          class="number"
          id="two"
        onclick="input+=2;
        print();
        
        ">
        2</button>
         <button
          class="number"
          id="three"
        onclick="input+=3;
        print();
        
        ">
        3</button>

        <button
       class="operator"
       id="add"
        onclick="input+='+';
        print();
        
        ">
        +</button>
        </p>
        <p>
         <button
          class="number"
          id="four"
        onclick="input+=4;
        print();
        
        ">
        4</button>


         <button
          class="number"
          id="five"
        onclick="input+=5;
        print();
        
        ">
        5</button>
        
         <button
          class="number"
          id="six"
        onclick="input+=6;
        print();
        
        ">
        6</button>

         
         <button
         class="operator"
         id="sub"
        onclick="input+='-';
        print();
        
        ">
        -</button>
        </p>
        <p>
         
        <button
         class="number"
         id="seven"
        onclick="input+=7;
        print();
        
        ">
        7</button>
        
         <button
          class="number"
          id="eight"
        onclick="input+=8;
        print();
        
        ">
        8</button>
        
        <button
         class="number"
         id="nine"
        onclick="input+=9;
        print();
        
        ">
        9</button>

         <button
         class="operator"
         id="mul"
        onclick="input+='*';
        print();
        
        ">
        *</button>
        </p>
        <p>
        
         <button
          class="number"
          id="zero"
        onclick="input+=0;
        print();
        
       ">
       
       
       0</button>

         <button
         class="number"
         id="decimal"
        onclick="input+='.';
        print();
        
        ">
        .</button>

        <button
        class="number"
        id="equal"
        onclick="answer();
        
        
        ">
        =</button>
        
       
       
         <button
         class="operator"
         id="divide"
        onclick="
        input+='/';
        print();
        ">
        /</button>
        </p>
        <p>
              <button style="font-size:17px;
              font-weight:normal;"

         class="number"
         id="clear"
        onclick="clearc();
        print();
        
        ">
        Clear</button>
        </p>
        

        
       
        
        <script src="scripts/calculator.js">
           
        </script>
        
                

    </body>
</html>
